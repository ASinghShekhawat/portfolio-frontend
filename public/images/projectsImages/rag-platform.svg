<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="AI Document Intelligence Platform cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1014"/>
      <stop offset="100%" stop-color="#07090C"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0DFC4B"/>
      <stop offset="100%" stop-color="#06D6F4"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#0DFC4B" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0DFC4B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#06D6F4" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#06D6F4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <rect width="800" height="500" fill="url(#glow1)"/>
  <rect width="800" height="500" fill="url(#glow2)"/>

  <!-- Documents -->
  <g transform="translate(80,150)" opacity="0.85">
    <rect x="0" y="0" width="160" height="200" rx="10" fill="#0F1419" stroke="#0DFC4B" stroke-opacity="0.5"/>
    <rect x="20" y="28" width="100" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.25"/>
    <rect x="20" y="48" width="120" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.18"/>
    <rect x="20" y="68" width="80" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.18"/>
    <rect x="20" y="88" width="110" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.18"/>
    <rect x="20" y="108" width="100" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.18"/>
    <rect x="20" y="128" width="60" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.18"/>
  </g>
  <g transform="translate(140,120) rotate(-6)" opacity="0.65">
    <rect x="0" y="0" width="160" height="200" rx="10" fill="#141A21" stroke="#06D6F4" stroke-opacity="0.4"/>
    <rect x="20" y="28" width="80" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.20"/>
    <rect x="20" y="48" width="120" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.14"/>
    <rect x="20" y="68" width="100" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.14"/>
  </g>

  <!-- Vector arrows -->
  <g stroke="url(#brand)" stroke-width="2" fill="none" opacity="0.9">
    <path d="M 330 250 L 460 250" stroke-dasharray="4 6"/>
    <path d="M 450 244 L 460 250 L 450 256" />
  </g>

  <!-- Vector chip / embedding -->
  <g transform="translate(490,160)">
    <rect x="0" y="0" width="240" height="180" rx="14" fill="#0F1419" stroke="url(#brand)" stroke-opacity="0.8" stroke-width="1.5"/>
    <text x="24" y="40" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" letter-spacing="2" fill="#9CA8B8">VECTOR · 1024D</text>
    <g font-family="JetBrains Mono, monospace" font-size="11" fill="#0DFC4B">
      <text x="24" y="68">0.871</text>
      <text x="80" y="68" fill="#06D6F4">-0.244</text>
      <text x="148" y="68" fill="#A78BFA">0.119</text>
      <text x="24" y="90" fill="#06D6F4">0.063</text>
      <text x="80" y="90">0.504</text>
      <text x="148" y="90" fill="#A78BFA">-0.792</text>
      <text x="24" y="112" fill="#A78BFA">0.330</text>
      <text x="80" y="112" fill="#0DFC4B">-0.158</text>
      <text x="148" y="112" fill="#06D6F4">0.927</text>
      <text x="24" y="134" fill="#06D6F4">0.011</text>
      <text x="80" y="134" fill="#A78BFA">0.612</text>
      <text x="148" y="134">-0.405</text>
    </g>
    <rect x="20" y="150" width="200" height="6" rx="3" fill="#0DFC4B" fill-opacity="0.18"/>
    <rect x="20" y="150" width="124" height="6" rx="3" fill="url(#brand)"/>
  </g>

  <!-- Title -->
  <g font-family="Space Grotesk, system-ui, sans-serif" fill="#F5F7FA">
    <text x="60" y="80" font-size="14" letter-spacing="4" fill="#0DFC4B">RAG · FAISS · LANGCHAIN</text>
    <text x="60" y="115" font-size="26" font-weight="700">AI Document Intelligence</text>
  </g>
  <text x="60" y="430" font-family="JetBrains Mono, monospace" font-size="12" letter-spacing="2" fill="#6B7785">100K+ PAGES · &lt;2s LATENCY · 500+ UPLOADS/HR</text>
</svg>
