<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Distributed Rate-Limiter Library cover">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1014"/>
      <stop offset="100%" stop-color="#07090C"/>
    </linearGradient>
    <linearGradient id="brand2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0DFC4B"/>
      <stop offset="100%" stop-color="#06D6F4"/>
    </linearGradient>
    <radialGradient id="g2a" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#06D6F4" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#06D6F4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2b" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#0DFC4B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0DFC4B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bg2)"/>
  <rect width="800" height="500" fill="url(#grid2)"/>
  <rect width="800" height="500" fill="url(#g2a)"/>
  <rect width="800" height="500" fill="url(#g2b)"/>

  <!-- Token bucket visualization -->
  <g transform="translate(80,160)">
    <text x="0" y="-12" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2" fill="#9CA8B8">TOKEN BUCKET</text>
    <!-- bucket outline -->
    <path d="M 0 20 L 20 200 L 180 200 L 200 20 Z" fill="none" stroke="url(#brand2)" stroke-width="2" opacity="0.7"/>
    <!-- fill -->
    <path d="M 12 80 L 24 200 L 176 200 L 188 80 Z" fill="url(#brand2)" opacity="0.30"/>
    <!-- tokens -->
    <g fill="#0DFC4B">
      <circle cx="60" cy="120" r="6"/>
      <circle cx="100" cy="110" r="6"/>
      <circle cx="140" cy="125" r="6"/>
      <circle cx="80" cy="160" r="6"/>
      <circle cx="120" cy="155" r="6"/>
      <circle cx="100" cy="185" r="6"/>
    </g>
    <!-- gauge text -->
    <text x="100" y="240" font-family="JetBrains Mono, monospace" font-size="12" text-anchor="middle" fill="#F5F7FA">847 / 1000</text>
  </g>

  <!-- Pipeline -->
  <g transform="translate(330,170)">
    <!-- request arrows -->
    <g stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5" fill="none" stroke-dasharray="3 5">
      <path d="M 0 30 L 90 30"/>
      <path d="M 0 75 L 90 75"/>
      <path d="M 0 120 L 90 120"/>
      <path d="M 0 165 L 90 165"/>
    </g>
    <g fill="#9CA8B8" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="1">
      <text x="0" y="22">GET /api/v1/users</text>
      <text x="0" y="67">POST /api/v1/orders</text>
      <text x="0" y="112">GET /api/v1/feed</text>
      <text x="0" y="157">PUT /api/v1/profile</text>
    </g>

    <!-- limiter box -->
    <rect x="110" y="10" width="170" height="190" rx="10" fill="#0F1419" stroke="url(#brand2)" stroke-width="1.5"/>
    <text x="195" y="36" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="700" fill="#F5F7FA">RATE LIMITER</text>
    <text x="195" y="54" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" letter-spacing="2" fill="#0DFC4B">REDIS · LUA</text>

    <!-- bar -->
    <rect x="130" y="80" width="130" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.08"/>
    <rect x="130" y="80" width="105" height="6" rx="3" fill="url(#brand2)"/>
    <text x="130" y="105" font-family="JetBrains Mono, monospace" font-size="10" fill="#9CA8B8">requests / window</text>

    <text x="130" y="140" font-family="JetBrains Mono, monospace" font-size="11" fill="#0DFC4B">  50,000 RPS</text>
    <text x="130" y="160" font-family="JetBrains Mono, monospace" font-size="11" fill="#06D6F4">  &lt;1ms overhead</text>
    <text x="130" y="180" font-family="JetBrains Mono, monospace" font-size="11" fill="#A78BFA">  3 microservices</text>

    <!-- outcomes -->
    <g stroke-width="1.5" fill="none">
      <path d="M 280 60 L 360 30" stroke="#0DFC4B" />
      <path d="M 280 105 L 360 105" stroke="#0DFC4B" />
      <path d="M 280 150 L 360 150" stroke="#0DFC4B" />
      <path d="M 280 175 L 360 200" stroke="#FF7070" stroke-dasharray="4 4"/>
    </g>
    <g font-family="JetBrains Mono, monospace" font-size="10" fill="#0DFC4B">
      <text x="370" y="35">200 OK</text>
      <text x="370" y="110">200 OK</text>
      <text x="370" y="155">200 OK</text>
    </g>
    <text x="370" y="205" font-family="JetBrains Mono, monospace" font-size="10" fill="#FF7070">429 TOO MANY</text>
  </g>

  <!-- Title -->
  <g font-family="Space Grotesk, system-ui, sans-serif" fill="#F5F7FA">
    <text x="60" y="80" font-size="14" letter-spacing="4" fill="#0DFC4B">JAVA · SPRING BOOT · REDIS</text>
    <text x="60" y="115" font-size="26" font-weight="700">Distributed Rate-Limiter</text>
  </g>
  <text x="60" y="430" font-family="JetBrains Mono, monospace" font-size="12" letter-spacing="2" fill="#6B7785">TOKEN BUCKET · SLIDING WINDOW · LUA ATOMICITY</text>
</svg>
