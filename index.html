<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07090C" />

    <title>Aditya Shekhawat — Full Stack Engineer</title>
    <meta name="description" content="Full-stack engineer building distributed systems, AI tooling, and clean product experiences. Currently @ BrowserStack." />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/favicons/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />

    <!-- Theme bootstrap: must run before paint to prevent flash of wrong theme -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("portfolio-theme");
          var theme = stored === "athos" || stored === "porthos" || stored === "aramis" ? stored : "porthos";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "porthos");
        }
      })();
    </script>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Aditya Shekhawat — Full Stack Engineer" />
    <meta property="og:description" content="Full-stack engineer building distributed systems, AI tooling, and clean product experiences." />
    <meta property="og:image" content="/images/profile.webp" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aditya Shekhawat — Full Stack Engineer" />
    <meta name="twitter:description" content="Full-stack engineer building distributed systems, AI tooling, and clean product experiences." />
  </head>

  </body>
